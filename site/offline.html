<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>ΜΝΗΜΗ · 需要网络</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0E0D0B; color: #EDE7DA;
      font-family: Georgia, "Noto Serif SC", serif;
    }
    .card { text-align: center; max-width: 28rem; padding: 2.5rem 1.5rem; }
    h1 { letter-spacing: 0.35em; font-weight: 500; font-size: 1.5rem; margin: 0 0 0.4rem; }
    p { color: #9A927F; font-size: 0.9rem; line-height: 1.85; margin: 0.8rem 0 0; }
    button {
      margin-top: 1.2rem; padding: 8px 16px; border-radius: 999px;
      border: 1px solid #6B6354; background: transparent; color: #EDE7DA;
      font: inherit; letter-spacing: 0.08em; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ΜΝΗΜΗ</h1>
    <p>这座记忆建筑需要网络才能取新卷。你已经打开过的公开正文仍可能留在本机；刷新后若外壳还在，会先打开工作台再取已缓存的公开卷。</p>
    <p>私密层、绝密正文、检索和队列不会缓存在这台设备上。</p>
    <p><button type="button" onclick="location.reload()">重新连接</button></p>
  </div>
</body>
</html>
