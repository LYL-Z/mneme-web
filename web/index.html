<!doctype html>
<!-- lang="zh-CN"：此前是 "zh"，中文排版/朗读引擎会走通用分支（拼音标注、断行、TTS 音库） -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：刘海屏/手势条安全区可用（CSS env(safe-area-*) 接管内缩） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- 首屏即写入壳。外置以通过 CSP script-src 'self'，避免鸿蒙 / iOS 先闪电脑左栏 -->
    <script src="/boot-device.js"></script>
    <meta name="description" content="ΜΝΗΜΗ · 刘佑林的前半生 · 数字传记装置" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F0E6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120E" />

    <!-- 图标：SVG 优先（矢量、任意尺寸清晰），PNG 兜底（Safari / iOS 桌面图标不支持 SVG） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA：可安装（manifest 补上后才有「添加到主屏/安装」入口） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ΜΝΗΜΗ" />

    <!-- 分享预览（站内 noindex，但链接在聊天工具里仍会抓取卡片） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ΜΝΗΜΗ" />
    <meta property="og:title" content="ΜΝΗΜΗ · 刘佑林的前半生" />
    <meta property="og:description" content="数字传记装置：百万字自传体小说素材宇宙的可视化" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:url" content="https://mneme-biography.app.workbuddy.link/" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ΜΝΗΜΗ · 刘佑林的前半生" />
    <meta name="twitter:description" content="数字传记装置：百万字自传体小说素材宇宙的可视化" />
    <meta name="twitter:image" content="/icon-512.png" />

    <title>ΜΝΗΜΗ · 刘佑林的前半生</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
